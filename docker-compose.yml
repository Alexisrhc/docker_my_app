services:
  web:
    build: .
    container_name: my_web_app
    ports:
      - "8081:80"
    volumes:
      - ./app:/usr/share/nginx/html
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge